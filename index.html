<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: #fafafa;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 50px;
}
.box {
  background: white;
  border: 1px solid #dbdbdb;
  width: 350px;
  padding: 40px;
  text-align: center;
}
input {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  background: #fafafa;
  border: 1px solid #dbdbdb;
  border-radius: 3px;
}
button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #0095f6;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
}
h2 {
  margin-bottom: 20px;
}
</style>
</head>
<body>

<div class="box">
  <h2>Tumhari Website Ka Naam</h2>
  <p style="color:grey; font-size:14px;">Apna account banao</p>
  
  <input type="text" placeholder="Mobile Number ya Email">
  <input type="text" placeholder="Pura Naam">
  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">
  
  <button>Sign Up</button>
</div>

</body>
</html>
