<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form - Arjook</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.form-box{background:#1e293b;padding:30px;border-radius:15px;width:100%;max-width:450px;box-shadow:0 0 20px #6366f1;}
h2{text-align:center;color:#a78bfa;margin-bottom:20px;}
label{display:block;margin-top:15px;margin-bottom:5px;font-size:14px;}
input{width:100%;padding:12px;border:none;border-radius:8px;background:#334155;color:#fff;outline:none;}
button{width:100%;padding:14px;margin-top:20px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
button:hover{opacity:0.9;}
</style>
</head>
<body>

<div class="form-box">
<h2>Registration Form</h2>

<form action="https://formsubmit.co/arjook1251@gmail.com" method="POST">

<label>Name / नाम</label><input type="text" name="Name" placeholder="अपना नाम लिखें" required>
<label>Gaon / गांव</label><input type="text" name="Gaon" placeholder="गांव का नाम" required>
<label>Qualification / योग्यता</label><input type="text" name="Qualification" placeholder="10th, 12th, Graduation" required>
<label>Number / नंबर</label><input type="number" name="Number" placeholder="10 अंकों का नंबर" required>
<label>Mother Name / माता का नाम</label><input type="text" name="Mother" required>
<label>Father Name / पिता का नाम</label><input type="text" name="Father" required>
<label>Brother Name / भाई का नाम</label><input type="text" name="Brother">
<label>Sister Name / बहन का नाम</label><input type="text" name="Sister">

<!-- सेटिंग -->
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">

<button type="submit">Submit करें</button>
</form>
</div>

</body>
</html>
